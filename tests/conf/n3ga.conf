# Non-orthogonal metric with irrational eigen vectors, det = -3: exercises the basis changes and the precision of the generated coefficients
# (test algebra of the Garamon unit tests, see tests/CMakeLists.txt)

<namespace>
n3ga
</namespace>

<dimension>
3
</dimension>

<metric>
 2  1  0
 1  1  0
 0  0 -3
</metric>

<basis vector name>
1 2 3
</basis vector name>

<metric decomposition refinement>
true
</metric decomposition refinement>

<metric decomposition numerical cleanup>
true
</metric decomposition numerical cleanup>

<metric decomposition numerical cleanup espilon>
0.0000001
</metric decomposition numerical cleanup espilon>

<max dimension precomputed products>
256
</max dimension precomputed products>

<max dimension basis accessor>
256
</max dimension basis accessor>
